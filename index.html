<style>

.layout { padding-block: 20px 48px; }

.panel-title, .v-current, .h-day, .t-color { text-transform: none; letter-spacing: 0; }
.panel-title { font-size: 13px; font-weight: 600; }
.list-title, .join-title, .present-title { font-family: var(--display); font-weight: 800; letter-spacing: -0.015em; }
.join { border: 1px solid var(--line); border-radius: 14px; }
.board, .chat-log { border: 1px solid var(--line); border-radius: 12px; }

    }
    area.append(h("h2", { class: "list-title" }, L.title),
      subtitleEl(st, !S.readOnly && S.tab === "board"),
      h("p", { class: "by" }, "Made by " + whoName(L.by).replace(/^You$/, "you") +
        (L.updatedAt && L.updatedAt !== L.at ? " · last change " + fmtTime(L.updatedAt) + " by " + whoName(L.updatedBy).replace(/^You$/, "you") : "")));
    const unread = S.tab === "chat" ? 0 : unreadCount();
    const tab = (key, label, extra) => h("button", { type: "button", "aria-pressed": String(S.tab === key), onclick: () => setTab(key) }, label, extra);
    const toolbar = (h("div", { class: "toolbar bottom" },
      h("div", { class: "tabs", role: "group", "aria-label": "List view" },
        tab("board", "Board"), tab("history", "History"), tab("chat", "Chat", unread ? h("span", { class: "badge", "aria-label": unread + " new" }, String(unread)) : null)),
      h("span", { class: "toolbar-right" }, h("span", { class: "meta" }, Object.keys(st.items).length + " items"),
        h("button", { class: "btn ghost small", type: "button", title: "Save the tier list as a picture", onclick: saveImage }, "Save image"),
        h("button", { class: "btn small", type: "button", title: "Show just the tier list, ready for a screenshot", onclick: enterPresent }, "Present"))));

    if (S.tab === "history") renderHistoryTab(area, L);
    else if (S.tab === "chat") { renderChatTab(area, L); markChatSeen(); }
    else renderBoardTab(area, L);
    const modal = area.querySelector(".modal-back");
    if (modal) area.insertBefore(toolbar, modal); else area.append(toolbar);
    const foot = area.querySelector(".list-foot");
    if (foot) toolbar.after(foot);

    if (keepChat != null && $("chatInput")) { $("chatInput").value = keepChat; $("chatInput").focus(); }
    if (keepItem != null && $("itemInput")) { $("itemInput").value = keepItem; $("itemInput").focus(); }
    if (S.showExport) area.append(exportModal());
  }

  function render() {
    const ae = document.activeElement && document.activeElement.id;
    if (ae === "gearName" && S.gear) return;
    if (ae === "subInput" && S.editingSub) return;
    if (ae === "noteInput" && S.picked) return;
    if (S.present && !curList()) S.present = false;
    document.body.classList.toggle("presenting", !!S.present);
    renderShell();
    if (!needsJoin()) { renderLists(); renderMain(); }
  }

  // ---- static wiring ----
  $("listForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const layout = (document.querySelector('input[name="newLayout"]:checked') || {}).value || "tiers";
    createList($("listInput").value, $("listSub").value, layout);
    $("listInput").value = ""; $("listSub").value = "";
  });
  $("pickBoard").addEventListener("change", (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ""; addImage(f); });
  $("pickChat").addEventListener("change", (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ""; sendChatImage(f); });
  $("joinForm").addEventListener("submit", (e) => { e.preventDefault(); join($("joinName").value); });
  $("joinCancel").addEventListener("click", () => { S.renaming = false; $("joinError").hidden = true; render(); });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    const mc = document.querySelector(".m-close");
    if (mc) { mc.click(); return; }
    if (S.present) { exitPresent(); return; }
    if (S.picked) { S.picked = null; render(); }
  });
  let exitTimer;
  function wakeExit() {
    const b = $("presentExit"); if (!b) return;
    b.classList.add("show"); clearTimeout(exitTimer);
    exitTimer = setTimeout(() => { const x = $("presentExit"); if (x) x.classList.remove("show"); }, 2200);
  }
  ["mousemove", "touchstart", "keydown"].forEach((ev) => document.addEventListener(ev, () => { if (S.present) wakeExit(); }, { passive: true }));
  function enterPresent() {
    S.present = true; S.picked = null; S.coloring = null; S.editingTier = null; S.gear = null;
    render(); window.scrollTo(0, 0); wakeExit();
    try { const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(() => {}); } catch (e) {}
  }
  function exitPresent() {
    S.present = false; render();
    try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {}); } catch (e) {}
  }

  render();

  // ---- connect ----
  async function start() {
    if (!window.claude || !window.claude.use) { S.loaded = true; render(); return; }
    const [db, user, assets, downloads] = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("assets"), window.claude.use("downloads")]);
    S.db = db; S.assets = assets; S.downloads = downloads;
    if (user) {
      const [id, owner, can] = await Promise.all([user.id(), user.isOwner(), user.can("data.write")]);
      S.me = id; S.isOwner = !!owner; S.canWrite = can;
    }
    S.readOnly = !db || !S.me || S.canWrite === false;
    if (!db) { S.loaded = true; render(); return; }

    let pending = 2;
    const ready = () => { if (pending > 0 && --pending === 0) { S.loaded = true; render(); syncSubs(); } else render(); };
    const fail = () => { S.loaded = true; render(); toast("Lost the live connection. Reload the page to reconnect."); };
    const toMap = (snap) => { const m = {}; for (const d of snap.docs) if (d.exists) m[d.id] = d.data(); return m; };
    db.collection("players").onSnapshot((snap) => { S.players = toMap(snap); ready(); }, fail);
    db.collection("lists").onSnapshot((snap) => {
      S.lists = toMap(snap);
      const before = S.current;
      ready();
      if (S.loaded && S.current !== before) syncSubs();
    }, fail);
  }
  start().catch(() => { S.loaded = true; render(); });
})();
</script>

</body></html>
